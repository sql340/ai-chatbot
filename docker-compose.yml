services:
  redis:
    image: redis:7.4-alpine
    container_name: ai-chatbot-redis
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

